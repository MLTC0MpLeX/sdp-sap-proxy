services:
  sdp-sap-proxy:
    image: ghcr.io/mltc0mplex/sdp-sap-proxy:latest
    container_name: sdp-sap-proxy
    restart: unless-stopped

    ports:
      - "8000:8000"

    environment:
      SAP_GROUP: 224.2.127.254
      SAP_PORT: 9875
      SAP_INTERVAL: 30
      SAP_TTL: 255

    volumes:
      - sdp-sap-data:/data

volumes:
  sdp-sap-data: